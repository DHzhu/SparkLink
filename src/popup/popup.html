<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparkLink - 星火链</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="popup-shell">
    <header class="popup-header">
      <div class="brand-row">
        <div class="brand-identity">
          <svg class="brand-logo" viewBox="0 0 128 128" width="26" height="26" aria-hidden="true">
            <defs>
              <linearGradient id="sl-logo-bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#111C38" />
                <stop offset="100%" stop-color="#080E1E" />
              </linearGradient>
              <linearGradient id="sl-logo-flame" x1="12.2" y1="-5.2" x2="12.2" y2="24.2" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFD466" />
                <stop offset="35%" stop-color="#FF8C0A" />
                <stop offset="76%" stop-color="#FF5900" />
                <stop offset="100%" stop-color="#E03200" />
              </linearGradient>
              <mask id="sl-logo-ring-cutout">
                <rect x="-10" y="-12" width="48" height="48" fill="#ffffff" />
                <circle cx="12.3" cy="13.0" r="7.15" fill="#000000" />
              </mask>
            </defs>
            <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sl-logo-bg)" />
            <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#24365E" stroke-width="2" stroke-opacity="0.65" />
            <g transform="translate(64, 68.5) scale(3.04) translate(-12.35, -10.2)">
              <path
                d="M12 24 C5.1 24 0.1 20.4 -0.8 14.8 C-1.4 11.9 0 10.2 -1.6 6.5 C1 7.5 2.2 9 2.9 10.7 C2.6 6.5 4.1 4.8 2.8 0.7 C5.5 1.8 7.2 4 7.8 6.2 C7.7 2.2 11.7 0 10.9 -5.1 C14.5 -2.9 15.8 0.4 15.5 3.5 C17.5 1.9 18.3 0.1 18.3 -2.4 C21.4 0.7 21 4 20.2 7.2 C22.5 6 23.6 4.5 24.1 2.9 C25.3 6.3 23.4 9.5 23.5 11.3 C24.9 10.8 25.6 9.8 26.2 8.8 C26.9 15.7 23.3 24 12 24 Z"
                fill="url(#sl-logo-flame)"
                mask="url(#sl-logo-ring-cutout)"
              />
              <circle cx="12.3" cy="13.0" r="7.15" fill="none" stroke="#FFE28A" stroke-width="0.65" stroke-opacity="0.88" />
            </g>
          </svg>
          <div>
            <div class="brand-title-line">
              <h1 class="brand-title">SparkLink</h1>
              <span class="brand-subtag">星火链</span>
            </div>
            <p class="brand-slogan">我不会错过你的每一次发声</p>
          </div>
        </div>
        <label class="switch-label" title="本浏览器采集开关">
          <input type="checkbox" id="collection-toggle" aria-label="本浏览器采集开关" />
          <span class="switch-slider"></span>
        </label>
      </div>

      <div class="account-bar">
        <label for="account-select" class="account-label">查看账号</label>
        <select id="account-select" class="account-select" aria-label="选择查看账号"></select>
        <span id="viewer-status-badge" class="viewer-status-badge">未启用</span>
      </div>
    </header>

    <main class="popup-main">
      <section id="initial-activation-banner" class="activation-card" hidden>
        <p class="activation-desc">在此设备记录主动回复的对象、次数和时间，用于徽章和排行</p>
        <button type="button" id="btn-enable-cta" class="btn btn-primary btn-block">开启本地统计</button>
      </section>

      <div id="status-banners" class="status-banners" aria-live="polite"></div>
      <div id="action-feedback" class="action-feedback" aria-live="polite" hidden></div>

      <section class="overview-card">
        <h2 id="overview-title" class="section-title">近 30 天已记录的主动回复（含导入）</h2>
        <p id="overview-coverage" class="coverage-note">来源包括本机网页活动和导入的备份，历史记录可能不完整。</p>
        <p id="latest-reply-time" class="latest-time">尚无已记录回复</p>

        <div class="stats-grid">
          <div class="stat-box">
            <span id="stat-total-replies" class="stat-value">0</span>
            <span class="stat-label">主动回复总数</span>
          </div>
          <div class="stat-box">
            <span id="stat-active-targets" class="stat-value stat-active">0</span>
            <span id="stat-active-label" class="stat-label">活跃对象 (≥11)</span>
          </div>
          <div class="stat-box">
            <span id="stat-deep-targets" class="stat-value stat-deep">0</span>
            <span id="stat-deep-label" class="stat-label">深度对象 (≥51)</span>
          </div>
        </div>
      </section>

      <section class="leaderboard-section">
        <div class="section-header-row">
          <h2 class="section-title">Top 20 互动排行</h2>
          <span class="section-hint">我 → 对方</span>
        </div>
        <div id="top20-empty" class="empty-state">尚无已记录回复</div>
        <ol id="top20-list" class="top20-list"></ol>
      </section>

      <section class="management-section">
        <h2 class="section-title">数据管理</h2>
        <button type="button" id="btn-history-sync" class="btn btn-secondary btn-block" disabled>同步最近数据</button>
        <p id="history-sync-status" class="coverage-note" role="status"></p>
        <div class="mgmt-grid">
          <button type="button" id="btn-cleanup" class="btn btn-secondary">清理过期记录</button>
          <button type="button" id="btn-export" class="btn btn-secondary">导出全部备份</button>
          <button type="button" id="btn-import" class="btn btn-secondary">导入备份 JSON</button>
          <input type="file" id="file-import" accept=".json,application/json" hidden />
          <button type="button" id="btn-clear-account" class="btn btn-danger-outline">清空当前账号</button>
        </div>
        <button type="button" id="btn-clear-all" class="btn btn-danger btn-block mgmt-clear-all">清空全部数据</button>
        <div class="debug-toggle-row">
          <span class="debug-toggle-label">调试日志（控制台输出同步诊断）</span>
          <label class="switch-label" title="同步调试日志开关">
            <input type="checkbox" id="debug-logs-toggle" aria-label="同步调试日志开关" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </section>
    </main>

    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" hidden>
      <div class="modal-card">
        <h3 id="modal-title" class="modal-title">确认操作</h3>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" id="btn-modal-cancel" class="btn btn-secondary">取消</button>
          <button type="button" id="btn-modal-confirm" class="btn btn-primary">确认</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./popup.js"></script>
</body>
</html>
